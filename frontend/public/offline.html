<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Offline — Family Meal Planner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #EFF6FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 4px 32px rgba(37, 99, 235, 0.12);
      max-width: 400px;
      width: 100%;
    }
    .icon-wrap {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      border-radius: 22px;
      overflow: hidden;
    }
    .icon-wrap img { width: 100%; height: 100%; }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1E3A8A;
      margin-bottom: 12px;
    }
    p {
      color: #3B82F6;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    button {
      background: #2563EB;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #1D4ED8; }
    .status {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #93C5FD;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <img src="/icon.svg" alt="Family Meal Planner"/>
    </div>
    <h1>You're offline</h1>
    <p>No internet connection detected.<br/>Check your network and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
    <p class="status">Your offline meal plan and grocery list are still available in the app.</p>
  </div>
</body>
</html>
