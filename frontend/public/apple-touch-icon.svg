<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="76" fill="#2563EB"/>

  <!-- Calendar header bar -->
  <rect x="60" y="52" width="392" height="78" rx="14" fill="#1D4ED8"/>

  <!-- Binding rings -->
  <circle cx="152" cy="52" r="16" fill="#1E40AF"/>
  <circle cx="152" cy="52" r="9" fill="#2563EB"/>
  <circle cx="256" cy="52" r="16" fill="#1E40AF"/>
  <circle cx="256" cy="52" r="9" fill="#2563EB"/>
  <circle cx="360" cy="52" r="16" fill="#1E40AF"/>
  <circle cx="360" cy="52" r="9" fill="#2563EB"/>

  <!-- Month label bar -->
  <rect x="196" y="76" width="120" height="16" rx="6" fill="rgba(255,255,255,0.28)"/>

  <!-- Calendar grid body -->
  <rect x="60" y="142" width="392" height="196" rx="8" fill="rgba(255,255,255,0.07)"/>

  <!-- Vertical dividers -->
  <line x1="116" y1="142" x2="116" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="172" y1="142" x2="172" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="228" y1="142" x2="228" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="284" y1="142" x2="284" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="340" y1="142" x2="340" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="396" y1="142" x2="396" y2="338" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Horizontal dividers -->
  <line x1="60" y1="207" x2="452" y2="207" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <line x1="60" y1="272" x2="452" y2="272" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Row 1 date dots -->
  <circle cx="88"  cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="144" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="200" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="256" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="312" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="368" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="424" cy="174" r="9" fill="rgba(255,255,255,0.55)"/>

  <!-- Row 2 date dots -->
  <circle cx="88"  cy="240" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="144" cy="240" r="9" fill="rgba(255,255,255,0.55)"/>
  <!-- Highlighted day -->
  <rect x="172" y="207" width="56" height="65" rx="8" fill="rgba(255,255,255,0.24)"/>
  <circle cx="200" cy="240" r="10" fill="white"/>
  <circle cx="256" cy="240" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="312" cy="240" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="368" cy="240" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="424" cy="240" r="9" fill="rgba(255,255,255,0.55)"/>

  <!-- Row 3 (partial) date dots -->
  <circle cx="88"  cy="305" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="144" cy="305" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="200" cy="305" r="9" fill="rgba(255,255,255,0.55)"/>
  <circle cx="256" cy="305" r="9" fill="rgba(255,255,255,0.4)"/>

  <!-- Chopsticks (drawn before bowl so bowl rim overlaps lower tips) -->
  <line x1="152" y1="336" x2="236" y2="392" stroke="#78350F" stroke-width="13" stroke-linecap="round"/>
  <line x1="360" y1="336" x2="276" y2="392" stroke="#78350F" stroke-width="13" stroke-linecap="round"/>

  <!-- Bowl drop shadow -->
  <ellipse cx="256" cy="472" rx="108" ry="14" fill="rgba(0,0,0,0.18)"/>

  <!-- Bowl body -->
  <path d="M 148 392 Q 144 466 256 466 Q 368 466 364 392 Z" fill="white"/>

  <!-- Bowl rim -->
  <ellipse cx="256" cy="392" rx="108" ry="27" fill="white" stroke="#D1D5DB" stroke-width="3"/>

  <!-- Rice grains — layer 1 (back) -->
  <ellipse cx="210" cy="412" rx="14" ry="6" fill="#F1F5F9" transform="rotate(-30,210,412)"/>
  <ellipse cx="256" cy="407" rx="14" ry="6" fill="#F1F5F9" transform="rotate(8,256,407)"/>
  <ellipse cx="302" cy="412" rx="14" ry="6" fill="#F1F5F9" transform="rotate(22,302,412)"/>

  <!-- Rice grains — layer 2 (middle) -->
  <ellipse cx="186" cy="430" rx="13" ry="5.5" fill="#F1F5F9" transform="rotate(-10,186,430)"/>
  <ellipse cx="232" cy="428" rx="14" ry="6"   fill="#F1F5F9" transform="rotate(15,232,428)"/>
  <ellipse cx="276" cy="427" rx="14" ry="6"   fill="#F1F5F9" transform="rotate(-18,276,427)"/>
  <ellipse cx="320" cy="430" rx="13" ry="5.5" fill="#F1F5F9" transform="rotate(8,320,430)"/>

  <!-- Rice grains — layer 3 (middle-front) -->
  <ellipse cx="214" cy="447" rx="13" ry="5.5" fill="#F1F5F9" transform="rotate(6,214,447)"/>
  <ellipse cx="256" cy="445" rx="14" ry="6"   fill="#F1F5F9" transform="rotate(-12,256,445)"/>
  <ellipse cx="296" cy="447" rx="13" ry="5.5" fill="#F1F5F9" transform="rotate(20,296,447)"/>

  <!-- Rice grains — layer 4 (front) -->
  <ellipse cx="240" cy="457" rx="12" ry="5" fill="#F1F5F9" transform="rotate(-8,240,457)"/>
  <ellipse cx="270" cy="457" rx="12" ry="5" fill="#F1F5F9" transform="rotate(12,270,457)"/>
</svg>
